<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Complaint Submitted | ResolveIT</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div th:replace="~{fragments :: nav}"></div>
<main class="container success-page">
  <div class="success-card"><div class="success-check">✓</div><span class="eyebrow">SUCCESSFULLY SUBMITTED</span><h1>Your voice has been heard.</h1><p>Your complaint has been recorded. Save your tracking ID so you can check for updates later.</p>
  <div class="ticket-box"><span>YOUR COMPLAINT TRACKING ID</span><strong th:text="'RI-' + ${submittedComplaint.id}">RI-1001</strong><small>Keep this ID for future reference.</small></div>
  <div class="success-details"><div><span>Complaint</span><b th:text="${submittedComplaint.title}">Title</b></div><div><span>Category</span><b th:text="${submittedComplaint.category}">Category</b></div><div><span>Status</span><b class="status submitted" th:text="${submittedComplaint.status}">Submitted</b></div></div>
  <div class="hero-actions centered"><a class="btn btn-primary" th:href="@{/track(id=${submittedComplaint.id})}">Track complaint →</a><a class="btn btn-outline" href="/">Back to dashboard</a></div></div>
</main></body></html>
