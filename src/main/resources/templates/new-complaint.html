<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Submit Complaint | ResolveIT</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div th:replace="~{fragments :: nav}"></div>
<main class="container form-page">
  <a class="back-link" href="/">← Back to dashboard</a>
  <div class="page-heading"><span class="eyebrow">CAMPUS SUPPORT</span><h1>Submit a complaint</h1><p>Tell us what happened. We'll route it to the right team.</p></div>
  <form class="form-card" th:action="@{/complaints}" method="post">
    <div class="form-intro"><div class="form-intro-icon">✎</div><div><h2>Complaint details</h2><p>Fields marked with * are required.</p></div></div>
    <div class="form-grid">
      <label>Full name *<input name="name" required placeholder="e.g. Priya Sharma"></label>
      <label>College email *<input name="email" type="email" required placeholder="you@college.edu"></label>
      <label>Category *<select name="category" required><option value="">Choose a category</option><option>IT & Wi-Fi</option><option>Classroom</option><option>Hostel</option><option>Electrical</option><option>Sanitation</option><option>Library</option><option>Transport</option><option>Other</option></select></label>
      <label>Location *<input name="location" required placeholder="e.g. Block B, Room 204"></label>
      <label>Priority<select name="priority"><option>Medium</option><option>Low</option><option>High</option></select></label>
      <label>Complaint title *<input name="title" required maxlength="100" placeholder="Briefly describe the issue"></label>
      <label class="full-width">Description *<textarea name="description" rows="5" required maxlength="2000" placeholder="Include details that will help us understand and resolve the issue..."></textarea><small>Do not include passwords or other sensitive personal information.</small></label>
    </div>
    <div class="form-error" th:if="${error}" th:text="${error}"></div>
    <div class="form-actions"><a class="btn btn-outline" href="/">Cancel</a><button class="btn btn-primary" type="submit">Submit complaint <span>→</span></button></div>
  </form>
  <footer>© 2026 ResolveIT · Online Complaint Management System</footer>
</main></body></html>
