<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | ResolveIT</title><link rel="stylesheet" href="/css/style.css">
<style>
.auth-wrap{max-width:500px;margin:65px auto;padding:32px;background:#fff;border:1px solid #e7e9f2;border-radius:18px;box-shadow:0 12px 35px #22274a0a}
.auth-wrap h1{margin:8px 0 10px;font-size:30px}.auth-wrap p{color:#8992a7;font-size:13px;line-height:1.6}
.auth-wrap label{display:block;margin:18px 0 7px;font-size:12px;font-weight:700;color:#4c5670}
.auth-wrap input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e2e6f0;border-radius:9px}
.auth-wrap button{width:100%;margin-top:22px}.auth-alert{padding:11px;border-radius:8px;background:#fff0f0;color:#a63d3d;font-size:12px;margin-top:14px}
.role-choice{display:block;text-decoration:none;text-align:center;margin-top:16px;padding:18px;border:1px solid #e2e6f0;border-radius:12px;color:#27304b;font-weight:700}
.role-choice:hover{border-color:#6558d3;background:#f8f7ff}.back-choice{display:inline-block;margin-top:18px;color:#6558d3;font-size:13px}
</style></head><body><div th:replace="~{fragments :: nav}"></div>
<main class="container"><section class="auth-wrap"><span class="eyebrow">SECURE CAMPUS ACCESS</span>
<div th:if="${selectedRole == ''}"><h1>Welcome to ResolveIT</h1><p>Choose how you want to sign in.</p>
<a class="role-choice" href="/login?role=STUDENT">Sign in as Student →</a><a class="role-choice" href="/login?role=ADMIN">Sign in as Admin →</a></div>
<div th:if="${selectedRole != ''}"><h1 th:text="${selectedRole == 'ADMIN' ? 'Administrator sign in' : 'Student sign in'}">Sign in</h1>
<p>Enter the credentials for your selected account.</p><form th:action="@{/login}" method="post">
<input type="hidden" name="selectedRole" th:value="${selectedRole}">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button class="btn btn-primary" type="submit">Sign in →</button></form><a class="back-choice" href="/login">← Choose a different role</a></div>
<div class="auth-alert" th:if="${param.error}" th:text="${param.error[0] == 'role' ? 'These credentials do not match the selected role. Choose the correct sign-in type.' : 'Incorrect username or password. Please try again.'}"></div>
<div class="auth-note" th:if="${param.logout}">You have been signed out successfully.</div></section>
<footer>© 2026 ResolveIT · Online Complaint Management System</footer></main></body></html>
